<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f33">
<title>¿Hay olas? · Sitges y El Prat</title>
<style>
  :root {
    --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
    --navy:#0b1f33; --accent:#0ea5e9;
    --si:#16a34a; --si-bg:#dcfce7; --si-tx:#166534;
    --reg:#d97706; --reg-bg:#fef3c7; --reg-tx:#92400e;
    --no:#dc2626; --no-bg:#fee2e2; --no-tx:#991b1b;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:64px; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Inter, Roboto, system-ui, sans-serif; background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); }

  .top { background:linear-gradient(135deg, var(--navy), #0f3a5f); color:#fff; }
  .top-in { max-width:1150px; margin:0 auto; padding:22px 16px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { width:42px; height:42px; border-radius:12px; background:#ffffff1a; display:grid; place-items:center; }
  .top h1 { margin:0; font-size:1.45rem; letter-spacing:-.02em; }
  .top p { margin:0; color:#cbd5e1; font-size:.85rem; }
  .updated { margin-left:auto; font-size:.78rem; color:#cbd5e1; background:#ffffff14; border:1px solid #ffffff22; padding:5px 10px; border-radius:999px; }
  nav { position:sticky; top:0; z-index:10; background:#ffffffd9; backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  nav div { max-width:1150px; margin:0 auto; padding:0 12px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  nav a { color:var(--mut); text-decoration:none; font-weight:600; font-size:.88rem; padding:12px 10px; white-space:nowrap; border-bottom:2px solid transparent; }
  nav a:hover { color:var(--ink); border-bottom-color:var(--accent); }

  main { max-width:1150px; margin:0 auto; padding:20px 12px 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:20px; box-shadow:0 1px 2px #0f172a0a, 0 4px 16px #0f172a08; }
  .eyebrow { font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  h2 { margin:2px 0 14px; font-size:1.35rem; letter-spacing:-.01em; }
  h3 { margin:22px 0 10px; font-size:.8rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  h3 small { text-transform:none; letter-spacing:0; font-weight:500; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .why { margin:-6px 0 14px; color:var(--mut); font-size:.9rem; }
  .why::first-letter { text-transform:uppercase; }

  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.75rem; font-weight:700; letter-spacing:.03em; }
  .pill.big { font-size:.95rem; padding:6px 16px; }
  .si { background:var(--si-bg); color:var(--si-tx); } .regular { background:var(--reg-bg); color:var(--reg-tx); } .no { background:var(--no-bg); color:var(--no-tx); }

  .hero { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:18px 20px; border-radius:12px; border-left:5px solid; margin-bottom:16px; }
  .hero.si { border-color:var(--si); } .hero.regular { border-color:var(--reg); } .hero.no { border-color:var(--no); }
  .hero-main { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .hero-main b { font-size:1.5rem; letter-spacing:-.01em; }
  .chip { display:inline-block; background:#fff; color:var(--ink); border:1px solid #0f172a14; border-radius:10px; padding:6px 12px; font-weight:700; font-size:1.05rem; box-shadow:0 1px 2px #0f172a0d; }
  .chip.sm { font-size:.8rem; padding:2px 8px; border-radius:8px; box-shadow:none; background:var(--bg); }
  .hero-meta { font-size:.9rem; font-weight:600; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:16px; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; }
  .tile span { font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .tile b { font-size:1.35rem; letter-spacing:-.01em; }
  .tile small { color:var(--mut); font-size:.78rem; min-height:1.1em; }

  .frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table { border-collapse:collapse; font-size:.85rem; white-space:nowrap; width:100%; }
  th, td { padding:6px 8px; text-align:center; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  th { font-size:.75rem; color:var(--mut); font-weight:600; background:#f8fafc; }
  th b { color:var(--ink); text-transform:capitalize; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0; background:#f8fafc; color:var(--mut); font-weight:600; font-size:.78rem; }
  td.wave { vertical-align:bottom; height:64px; padding-bottom:0; border-bottom:0; }
  td.kj { background:var(--navy); color:#fff; font-weight:700; }
  td.day, th.day { border-left:1px solid #cbd5e1; }
  .list td { text-align:left; padding:10px 12px; }
  .list td:first-child { position:static; background:none; color:var(--ink); }
  .dir { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; color:var(--mut); font-weight:600; }
  .dir svg { fill:var(--ink); flex:none; }
  .wbox { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:8px; background:#eef2f7; }
  .tile .dir { font-size:1.1rem; color:var(--ink); }
  .warn { color:var(--no); font-weight:700; }
  .wisuki { width:100%; height:480px; border:0; border-radius:12px; }
  .aemet img { max-width:100%; display:block; margin:0 auto; border-radius:8px; }
  .aemet-ctl { display:flex; align-items:center; gap:12px; margin-top:10px; }
  .aemet-ctl input { flex:1; accent-color:var(--accent); }
  .aemet-ctl p { margin:0; font-weight:700; min-width:130px; text-align:right; text-transform:capitalize; }
  footer { max-width:1150px; margin:0 auto; text-align:center; color:var(--mut); font-size:.75rem; padding:0 16px 28px; }
  @media (max-width:600px) {
    section { padding:16px; border-radius:14px; } .updated { margin-left:0; } .hero-main b { font-size:1.25rem; }
    /* En móvil cada franja de "¿Dónde voy?" en varias líneas, para que las playas se vean sin desplazar. */
    .list, .list tbody, .list td { display:block; }
    .list tr { display:grid; grid-template-columns:1fr auto; gap:4px 8px; padding:10px 12px; border-bottom:1px solid var(--line); }
    .list tr:last-child { border-bottom:0; }
    .list td { padding:0; border:0; white-space:normal; }
    .list td:nth-child(3), .list td:nth-child(4) { color:var(--mut); font-size:.8rem; }
    .list td:nth-child(4) { text-align:right; }
    .list td:nth-child(5) { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><svg viewBox="0 0 40 30" width="26" height="20" aria-hidden="true"><path fill="#7dd3fc" d="M0 30C6 30 8 12 18 8C26 5 32 9 34 14C29 11 24 13 24 19C24 25 30 28 40 30Z"/></svg></div>
    <div><h1>¿Hay olas?</h1><p>Sitges · El Prat</p></div>
    <span class="updated" id="updated">Cargando previsión…</span>
  </div>
</header>
<nav aria-label="Secciones"><div>
  <a href="#donde">¿Dónde voy?</a><a href="#sitges">Sitges</a><a href="#el-prat">El Prat</a><a href="#aemet">Mapa AEMET</a>
</div></nav>
<main>
  <div id="spots"></div>

  <section class="aemet" id="aemet">
    <div class="eyebrow">Mapa</div>
    <h2>AEMET · Mar combinada, costa de Cataluña</h2>
    <img id="aemet-img" alt="Mapa de AEMET de altura de mar combinada en la costa de Cataluña">
    <div class="aemet-ctl">
      <input id="aemet-slider" type="range" min="0" max="38" step="1" aria-label="Hora del mapa de AEMET">
      <p id="aemet-label"></p>
    </div>
  </section>
</main>
<footer>
  Datos: <a href="https://open-meteo.com/">Open-Meteo</a> (modelos GFS-Wave, ECMWF WAM, Météo-France), AEMET y Wisuki.
  Cámaras: Escola Catalana de Surf · Ajuntament del Prat.
</footer>

<script>
// Umbrales del veredicto: cámbialos a tu gusto.
const CFG = {
  minH: 0.4,       // m: por debajo, no hay ola
  goodH: 0.6,      // m: a partir de aquí, buena
  minT: 5,         // s: por debajo, periodo demasiado corto
  goodT: 6,        // s: a partir de aquí, bueno
  calmWind: 10,    // km/h: por debajo, el viento da igual
  maxOnshore: 20,  // km/h: viento de mar más fuerte que esto = no
  maxSpread: 0.3,  // m: si los modelos difieren más, se marca ⚠
  bigH: 1.5,       // m: a partir de aquí, "muy grande"
  hours: [7, 10, 13, 16, 19],
  days: 4,
};

// Dónde ir según de dónde viene el mar (dirección de la ola en Sitges). big = spots si está muy grande.
const ZONES = {
  'Norte':        { dirs: ['N', 'NNE', 'NE', 'ENE'], spots: ['El Prat', 'Sitges playa'], big: ['Balmins'] },
  'Este (recto)': { dirs: ['E', 'ESE', 'SE'], spots: ['Sitges playa', 'Port Ginesta', 'El Prat', 'Aiguadolç', 'Balmins'] },
  'Sur':          { dirs: ['SSE', 'S', 'SSW', 'SW', 'WSW'], spots: ['Sitges playa', 'Port Ginesta'], big: ['Aiguadolç'] },
};

const MODELS = { ncep_gfswave025: 'GFS', ecmwf_wam025: 'ECMWF', meteofrance_wave: 'M-France' };

// facing = hacia dónde mira la playa (grados). sea = punto de mar para el oleaje, land = playa para el viento.
const SPOTS = [
  { name: 'Sitges', facing: 160, sea: [41.23, 1.81], land: [41.235, 1.81], wisuki: 2743,
    cam: 'https://www.ipcamlive.com/player/player.php?alias=65d33d2760353&autoplay=1&token=rJjnDBVreI2kFLL1TkWL%2Fwaq5emYvM%2FBQnEbhIStbuo%3D' },
  { name: 'El Prat', facing: 150, sea: [41.28, 2.12], land: [41.288, 2.106], wisuki: 5984,
    cam: 'https://www.streamingbarcelona.com/plataforma/ajuntament-elprat/embed/' },
];

const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const median = arr => {
  const a = arr.filter(x => x != null).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
};
const cardinal = d => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d / 22.5) % 16];
// Iconos estilo Surfline: apuntan hacia donde va (dirección "desde" + 180, el SVG ya apunta abajo).
const svgDir = (d, path) => `<svg viewBox="0 0 24 24" width="18" height="18" style="transform:rotate(${d}deg)" aria-hidden="true"><path d="${path}"/></svg>`;
const swellIcon = d => d == null ? '–' : `<span class="dir">${svgDir(d, 'M12 22 5 3l7 5 7-5z')}${cardinal(d)}</span>`;
const windIcon = d => d == null ? '–' : `<span class="dir"><span class="wbox">${svgDir(d, 'M10 2h4v12h5l-7 8-7-8h5z')}</span>${cardinal(d)}</span>`;
const fmt = (x, n = 1) => x == null ? '–' : x.toFixed(n);

function windType(windDir, facing) {
  const d = angDiff(windDir, facing + 180);
  return d <= 45 ? 'offshore' : d <= 80 ? 'cross-off' : d <= 100 ? 'cross' : 'onshore';
}

function verdict(s, facing) {
  if (s.h == null || s.t == null) return { v: 'no', why: 'sin datos' };
  const wt = windType(s.windDir, facing);
  if (s.wdir != null && angDiff(s.wdir, facing) > 90) return { v: 'no', why: 'la ola no entra (viene de tierra)' };
  if (s.h < CFG.minH) return { v: 'no', why: 'poca ola' };
  if (s.t < CFG.minT) return { v: 'no', why: 'periodo muy corto' };
  if (wt === 'onshore' && s.wind > CFG.maxOnshore) return { v: 'no', why: 'viento de mar fuerte' };
  const goodWind = s.wind < CFG.calmWind || wt === 'offshore' || wt === 'cross-off';
  if (s.h >= CFG.goodH && s.t >= CFG.goodT && goodWind) return { v: 'si', why: 'buenas condiciones' };
  const why = [s.h < CFG.goodH && 'ola justa', s.t < CFG.goodT && 'periodo corto', !goodWind && `viento ${wt}`].filter(Boolean);
  return { v: 'regular', why: why.join(', ') };
}

function recommend(s) {
  if (s.h == null || s.wdir == null) return { text: 'Sin datos', spots: [] };
  if (s.h < CFG.minH) return { text: 'Poca ola', spots: [] };
  const c = cardinal(s.wdir);
  const zone = Object.keys(ZONES).find(k => ZONES[k].dirs.includes(c));
  if (!zone) return { text: `Mar de tierra (${c}), no entra`, spots: [] };
  const z = ZONES[zone], big = s.h >= CFG.bigH && z.big;
  return { text: zone + (big ? ', muy grande' : ''), spots: big ? z.big : z.spots };
}

// Energía como la de surf-forecast: ρ·g²·H²·T²/(16π) = 1.962·H²·T² kJ (cuadra con sus números: 0.8 m, 6 s → 45 kJ).
const energy = (h, t) => h == null || t == null ? null : 1.962 * h * h * t * t;
const kjColor = e => e < 20 ? '#90cdf4' : e < 50 ? '#4299e1' : e < 100 ? '#805ad5' : e < 200 ? '#d53f8c' : '#c53030';
// Ola dibujada: más grande y más "caliente" cuanta más energía.
function waveIcon(e) {
  if (e == null) return '';
  const w = Math.min(60, 10 + Math.sqrt(e) * 3.5);
  return `<svg viewBox="0 0 40 30" width="${w}" height="${w * 0.75}" aria-hidden="true"><path fill="${kjColor(e)}"
    d="M0 30C6 30 8 12 18 8C26 5 32 9 34 14C29 11 24 13 24 19C24 25 30 28 40 30Z"/></svg>`;
}

// Recomendación con todas las playas a esa hora (la primera, Sitges, da la dirección del mar).
// Si en ninguna el veredicto pasa de NO, no hay nada.
const RANK = { no: 0, regular: 1, si: 2 };
function where(slotsAtTime) {
  const best = slotsAtTime.reduce((a, s) => RANK[s.verdict.v] > RANK[a] ? s.verdict.v : a, 'no');
  const rec = recommend(slotsAtTime[0]);
  if (best === 'no' || !rec.spots.length) return { text: 'No hay nada', spots: [], v: 'no' };
  return { ...rec, v: best };
}

const LABEL = { si: 'SÍ', regular: 'REGULAR', no: 'NO' };
const DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const slotLabel = s => `${DAYS[new Date(s.time).getDay()]} ${new Date(s.time).getDate()} ${s.time.slice(11, 13)}h`;

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

async function loadSpot(spot) {
  const [lat, lon] = spot.sea, [wlat, wlon] = spot.land;
  const vars = 'wave_height,wave_period,wave_direction';
  const [marine, wind] = await Promise.all([
    getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=${vars}&models=${Object.keys(MODELS)}&timezone=Europe%2FMadrid&forecast_days=${CFG.days}`),
    getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${wlat}&longitude=${wlon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kmh&timezone=Europe%2FMadrid&forecast_days=${CFG.days}`),
  ]);
  const wi = Object.fromEntries(wind.hourly.time.map((t, i) => [t, i]));
  const m = marine.hourly;
  return m.time.map((time, i) => {
    const hs = {}, ts = [], ds = [];
    for (const [k, label] of Object.entries(MODELS)) {
      hs[label] = m[`wave_height_${k}`][i];
      ts.push(m[`wave_period_${k}`][i]);
      ds.push(m[`wave_direction_${k}`][i]);
    }
    const hv = Object.values(hs).filter(x => x != null);
    const j = wi[time];
    const s = {
      time, hs,
      h: median(hv),
      spread: hv.length > 1 ? Math.max(...hv) - Math.min(...hv) : 0,
      t: median(ts),
      wdir: ds.find(d => d != null) ?? null, // dirección del primer modelo con dato (GFS)
      wind: wind.hourly.wind_speed_10m[j],
      gust: wind.hourly.wind_gusts_10m[j],
      windDir: wind.hourly.wind_direction_10m[j],
    };
    // Con el modelo GFS, que es el que usa surf-forecast.
    s.energy = energy(hs.GFS ?? s.h, m.wave_period_ncep_gfswave025[i] ?? s.t);
    s.verdict = verdict(s, spot.facing);
    return s;
  });
}

function localKey(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:00`;
}

const nowSlot = slots => slots.find(s => s.time === localKey(new Date())) ?? slots[0];

// Horas fijas del día; hoy solo desde hace ~2 h en adelante.
function upcoming(slots) {
  const today = localKey(new Date()).slice(0, 10);
  return slots.filter(s => {
    const h = +s.time.slice(11, 13), day = s.time.slice(0, 10);
    return CFG.hours.includes(h) && (day > today || (day === today && h >= new Date().getHours() - 2));
  });
}

// allSlots: las franjas de cada playa; la primera (Sitges) marca las horas.
function renderWhere(allSlots) {
  const byTime = allSlots.map(sl => Object.fromEntries(sl.map(s => [s.time, s])));
  const at = s => byTime.map(m => m[s.time]).filter(Boolean);
  const rec = where(at(nowSlot(allSlots[0])));
  // Junta franjas seguidas con la misma recomendación.
  const groups = [];
  for (const s of upcoming(allSlots[0])) {
    const r = where(at(s)), last = groups.at(-1);
    if (last && last.r.text === r.text && last.r.v === r.v && last.r.spots.join() === r.spots.join()) { last.to = s; last.hs.push(s.h); }
    else groups.push({ r, from: s, to: s, hs: [s.h] });
  }
  return `
  <section id="donde">
    <div class="eyebrow">Recomendación</div>
    <h2>¿Dónde voy?</h2>
    <div class="hero ${rec.v}">
      <div class="hero-main">${rec.spots.length ? rec.spots.map(x => `<span class="chip">${x}</span>`).join('') : '<b>No hay nada</b>'}</div>
      <div class="hero-meta">Ahora${rec.spots.length ? ` · mar del ${rec.text} · ${LABEL[rec.v]}` : ''}</div>
    </div>
    <div class="scroll"><table class="list">
      ${groups.map(g => `<tr><td>${slotLabel(g.from)}${g.to !== g.from ? ' → ' + slotLabel(g.to) : ''}</td>
        <td><span class="pill ${g.r.v}">${g.r.spots.length ? LABEL[g.r.v] : 'NO'}</span></td>
        <td>${g.r.spots.length ? g.r.text : ''}</td><td>${[...new Set([Math.min(...g.hs), Math.max(...g.hs)].map(x => fmt(x)))].join('–')} m</td>
        <td>${g.r.spots.map(x => `<span class="chip sm">${x}</span>`).join(' ') || '<span style="color:var(--mut)">No hay nada</span>'}</td></tr>`).join('')}
    </table></div>
  </section>`;
}

function renderSpot(spot, slots) {
  const now = nowSlot(slots);
  const cols = upcoming(slots);
  const isDayStart = (s, i) => i === 0 || s.time.slice(0, 10) !== cols[i - 1].time.slice(0, 10);
  const row = (label, f, cls = '') => `<tr class="${cls}"><td>${label}</td>${cols.map((s, i) => {
    const [content, c = ''] = [].concat(f(s));
    return `<td class="${c} ${isDayStart(s, i) ? 'day' : ''}">${content}</td>`;
  }).join('')}</tr>`;

  const wt = windType(now.windDir, spot.facing);
  const tile = (label, value, sub = '') => `<div class="tile"><span>${label}</span><b>${value}</b><small>${sub}</small></div>`;
  return `
  <section id="${spot.name.toLowerCase().replace(/\s+/g, '-')}">
    <div class="head">
      <div><div class="eyebrow">Spot · ahora</div><h2>${spot.name}</h2></div>
      <span class="pill big ${now.verdict.v}">${LABEL[now.verdict.v]}</span>
    </div>
    <p class="why">${now.verdict.why}${now.spread > CFG.maxSpread ? ' · <span class="warn">⚠ los modelos no coinciden</span>' : ''}</p>
    <div class="tiles">
      ${tile('Ola', `${fmt(now.h)} m`, now.spread > CFG.maxSpread ? '<span class="warn">⚠ poco fiable</span>' : 'media de 3 modelos')}
      ${tile('Periodo', `${fmt(now.t)} s`)}
      ${tile('Energía', `${fmt(now.energy, 0)} kJ`, waveIcon(now.energy))}
      ${tile('Mar de', swellIcon(now.wdir), 'dirección del oleaje')}
      ${tile('Viento', `${fmt(now.wind, 0)} km/h`, `rachas ${fmt(now.gust, 0)}`)}
      ${tile('Viento de', windIcon(now.windDir), wt)}
    </div>
    <div class="frame"><iframe src="${spot.cam}" title="Webcam ${spot.name}" allow="autoplay; fullscreen"></iframe></div>

    <h3>Previsión · 4 días <small>(⚠ = los modelos no coinciden, menos fiable)</small></h3>
    <div class="scroll"><table>
      <tr><th></th>${cols.map((s, i) => {
        const d = new Date(s.time);
        return `<th class="${isDayStart(s, i) ? 'day' : ''}">${isDayStart(s, i) ? `<b>${DAYS[d.getDay()]} ${d.getDate()}</b>` : ''}<br>${s.time.slice(11, 13)}h</th>`;
      }).join('')}</tr>
      ${row('Veredicto', s => `<span class="pill ${s.verdict.v}">${LABEL[s.verdict.v]}</span>`)}
      ${row('Ola (m)', s => `<b>${fmt(s.h)}</b>${s.spread > CFG.maxSpread ? ' <span class="warn" title="Los modelos no coinciden">⚠</span>' : ''}`)}
      ${row('Periodo (s)', s => fmt(s.t))}
      ${row('', s => [waveIcon(s.energy), 'wave'])}
      ${row('Energía (kJ)', s => [fmt(s.energy, 0), 'kj'])}
      ${row('Dir. ola', s => swellIcon(s.wdir))}
      ${row('Viento km/h', s => `${fmt(s.wind, 0)} <small>(${fmt(s.gust, 0)})</small>`)}
      ${row('Dir. viento', s => `${windIcon(s.windDir)}<br><small>${windType(s.windDir, spot.facing)}</small>`)}
    </table></div>

    <h3>Wisuki</h3>
    <iframe class="wisuki" loading="lazy" scrolling="no" title="Previsión Wisuki ${spot.name}"
      src="https://wisuki.com/widget-details?spot=${spot.wisuki}&lang=es&spotinfo=0&disablenighttime=1"></iframe>
  </section>`;
}

async function main() {
  const box = document.getElementById('spots');
  const results = await Promise.allSettled(SPOTS.map(loadSpot));
  // La recomendación usa el mar de Sitges (primer spot).
  const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  box.innerHTML = (results[0].status === 'fulfilled' ? renderWhere(ok) : '') + results.map((r, i) => r.status === 'fulfilled'
    ? renderSpot(SPOTS[i], r.value)
    : `<section id="${SPOTS[i].name.toLowerCase().replace(/\s+/g, '-')}"><h2>${SPOTS[i].name}</h2><p class="warn">No se pudo cargar la previsión: ${r.reason.message}</p></section>`).join('');
  document.getElementById('updated').textContent = 'Actualizado: ' + new Date().toLocaleString('es-ES', { weekday: 'long', hour: '2-digit', minute: '2-digit' });
}

// AEMET publica una pasada al día (00 UTC), un mapa cada 3 h de +6 a +120 h.
function aemet() {
  const img = document.getElementById('aemet-img'), slider = document.getElementById('aemet-slider'), label = document.getElementById('aemet-label');
  const run = new Date(); run.setUTCHours(0, 0, 0, 0);
  let fellBack = false;
  const ymd = d => d.toISOString().slice(0, 10).replaceAll('-', '');
  const step = i => 6 + 3 * i;
  const closest = () => Math.max(0, Math.min(38, Math.round(((Date.now() - run) / 3600e3 - 6) / 3)));
  const show = i => {
    slider.value = i;
    img.src = `https://www.aemet.es/imagenes_d/eltiempo/prediccion/mod_maritima/${ymd(run)}00+${String(step(i)).padStart(3, '0')}_aewam_cat_martot.png`;
    label.textContent = new Date(+run + step(i) * 3600e3).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  };
  // Si la pasada de hoy aún no está publicada, usa la de ayer.
  img.onerror = () => {
    if (fellBack) { label.textContent = 'Mapa no disponible'; return; }
    fellBack = true; run.setUTCDate(run.getUTCDate() - 1); show(closest());
  };
  slider.oninput = () => show(+slider.value);
  show(closest());
}

aemet();
main();
